name: workbench-ci

on:
  push:
    paths:
      - "workbench/**"
      - ".github/workflows/workbench-ci.yml"
  pull_request:
    paths:
      - "workbench/**"

jobs:
  server:
    name: Server build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: workbench/server
        run: mvn -B verify

  web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        working-directory: workbench/web
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: workbench/web
        run: pnpm typecheck
      - name: Build web apps
        working-directory: workbench/web
        run: pnpm build
