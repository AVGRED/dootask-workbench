services:
  mysql:
    image: mysql:8.0
    container_name: workbench-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-workbench}
      MYSQL_USER: ${MYSQL_USER:-workbench}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-workbench}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build:
      context: ./server
    container_name: workbench-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-workbench}
      DB_PASSWORD: ${MYSQL_PASSWORD:-workbench}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-32-bytes-min}
      STORAGE_ROOT: /app/data/uploads
      SERVER_PORT: 9000
    ports:
      - "${SERVER_PORT:-9000}:9000"
    volumes:
      - uploads:/app/data/uploads

  web:
    build:
      context: ./web
    container_name: workbench-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${STAFF_PORT:-8080}:8080"
      - "${ADMIN_PORT:-8081}:8081"
      - "${MOBILE_PORT:-8082}:8082"

volumes:
  mysql-data:
  uploads:
