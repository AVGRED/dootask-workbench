<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="星图">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="55%" stop-color="#5b52ea" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#sg)" />
  <rect width="128" height="128" rx="30" fill="url(#glow)" />

  <!-- 连线：一颗主星连向两颗小星 -->
  <g stroke="#ffffff" stroke-opacity="0.88" stroke-width="3" stroke-linecap="round">
    <line x1="56" y1="54" x2="87" y2="82" />
    <line x1="56" y1="54" x2="38" y2="90" />
  </g>

  <!-- 主星：4 角星 -->
  <path
    d="M56 18 C59.5 40 68.5 49 90 52 C68.5 55 59.5 64 56 86 C52.5 64 43.5 55 22 52 C43.5 49 52.5 40 56 18 Z"
    fill="#ffffff"
  />

  <!-- 节点星 -->
  <circle cx="87" cy="82" r="7.4" fill="#ffffff" />
  <circle cx="38" cy="90" r="5.4" fill="#ffffff" fill-opacity="0.92" />
</svg>
