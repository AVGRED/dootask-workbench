server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:workbench}
    password: ${DB_PASSWORD:workbench}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

workbench:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-32-bytes-min}
    ttl: PT12H
  storage:
    root: ${STORAGE_ROOT:./data/uploads}
  mail:
    enabled: ${MAIL_ENABLED:false}
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@workbench.local}
    base-url: ${WORKBENCH_BASE_URL:http://localhost:5180}

springdoc:
  # 生产默认关闭：/v3/api-docs 与 swagger-ui 不需要公网可访问
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
