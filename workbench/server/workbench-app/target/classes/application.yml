server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:workbench}
    password: ${DB_PASSWORD:workbench}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

workbench:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-32-bytes-min}
    ttl: PT12H
  storage:
    root: ${STORAGE_ROOT:./data/uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
