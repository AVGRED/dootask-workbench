server:
  port: 9000

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/workbench?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: workbench
    password: workbench
  flyway:
    enabled: true
    locations: classpath:db/migration

workbench:
  jwt:
    secret: change-me-in-production-please-use-32-bytes-min
    ttl: PT12H

springdoc:
  api-docs:
    path: /v3/api-docs
