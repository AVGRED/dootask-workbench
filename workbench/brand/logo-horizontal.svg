<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="星图 STARMAP">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="55%" stop-color="#5b52ea" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="hglow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="hclip"><rect x="8" y="16" width="64" height="64" rx="15" /></clipPath>
  </defs>

  <!-- 图标 -->
  <g clip-path="url(#hclip)">
    <rect x="8" y="16" width="64" height="64" fill="url(#hg)" />
    <rect x="8" y="16" width="64" height="64" fill="url(#hglow)" />
    <g stroke="#ffffff" stroke-opacity="0.88" stroke-width="1.5" stroke-linecap="round">
      <line x1="36" y1="45" x2="51.5" y2="59.5" />
      <line x1="36" y1="45" x2="27" y2="63.5" />
    </g>
    <path
      d="M36 26 C37.75 37.5 42.5 42.25 54 44 C42.5 45.75 37.75 50.5 36 62 C34.25 50.5 29.5 45.75 18 44 C29.5 42.25 34.25 37.5 36 26 Z"
      fill="#ffffff"
    />
    <circle cx="51.5" cy="59.5" r="3.7" fill="#ffffff" />
    <circle cx="27" cy="63.5" r="2.7" fill="#ffffff" fill-opacity="0.92" />
  </g>

  <!-- 文字 -->
  <text x="88" y="58" font-family="PingFang SC, Microsoft YaHei, Inter, sans-serif" font-size="34" font-weight="700" fill="#1e2233" letter-spacing="2">星图</text>
  <text x="90" y="78" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#8b91a4" letter-spacing="4.2">STARMAP</text>
</svg>
